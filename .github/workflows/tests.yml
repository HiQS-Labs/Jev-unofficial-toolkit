name: mock-only tests
# Manual only while the operator has paused testing.
on: workflow_dispatch
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run stdlib tests with networking blocked in the test process
        run: python3 -m unittest discover -s tests -v
        env:
          CI: 'true'
          TYPESAFE_API_KEY: ''
